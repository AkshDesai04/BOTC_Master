name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject roster dispatch config
        env:
          ROSTER_DISPATCH_TOKEN: ${{ secrets.ROSTER_DISPATCH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          token = os.environ.get("ROSTER_DISPATCH_TOKEN", "")
          # Escape for JS string literal
          safe = token.replace("\\", "\\\\").replace('"', '\\"')
          content = f'''window.ROSTER_DISPATCH_CONFIG = {{
            owner: "AkshDesai04",
            repo: "BOTC_Master",
            token: "{safe}"
          }};
          '''
          with open("scripts/runtime-config.js", "w", encoding="utf-8") as handle:
              handle.write(content)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
