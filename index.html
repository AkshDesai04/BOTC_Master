<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>Storyteller's Grimoire</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

<main id="app"></main>

<!-- Load all BOTC script data -->
<script src="scripts/runtime-config.js"></script>
<script src="scripts/icons.js"></script>
<script src="scripts/history.js"></script>
<script src="scripts/game-rules.js"></script>
<script src="scripts/email.js"></script>
<script src="scripts/trouble_brewing.js"></script>
<script src="scripts/bad_moon_rising.js"></script>
<script src="scripts/sects_and_violets.js"></script>
<script src="scripts/handoff-qr.js"></script>
<script src="scripts/common.js"></script>
<script src="scripts/handoff.js"></script>
<script>
// Start game engine
(function() {
  try {
    const saved = loadFromStorage();
    if (saved && saved._saved) {
      if (hydrateState(saved) !== false) state.showResume = true;
    } else {
      const requestedScript = new URLSearchParams(window.location.search).get("script");
      if (["tb", "bmr", "sv"].includes(requestedScript)) {
        pickScript(requestedScript);
        return;
      }
      state.screen = "select";
    }
    render();
  } catch (error) {
    console.error("Initialization error:", error);
    const app = document.getElementById("app");
    if (app) {
      app.innerHTML = `<div class="screen" role="alert" style="padding:32px;text-align:center">
        <h2 style="color:var(--red);margin-bottom:16px">Saved Session Could Not Be Loaded</h2>
        <p style="color:var(--text2);margin-bottom:8px">The saved data is incomplete or damaged. Clear it to return to script selection.</p>
        <button class="btn btn-primary" style="margin-top:16px" onclick="localStorage.removeItem('botc_storyteller_v2');localStorage.removeItem('botc_storyteller_history_v1');localStorage.removeItem('botc_storyteller_email_outbox_v1');location.assign(location.pathname)">Clear Saved Session</button>
      </div>`;
    }
  }
})();
</script>
</body>
</html>
